version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      types:
        patterns: ["@types/*"]
      eslint:
        patterns: ["eslint*", "@typescript-eslint/*"]
    # Majors que NÃO são bump, são migração (decisão do dono, 2026-09-07):
    #
    #  - `@types/node`: fica em 22.x. Tipos de Node 26 não podem representar um
    #    runtime, CI e Docker que rodam Node 22 (`engines.node` ">=22.13.0 <23",
    #    `node:22-alpine`, matriz `['22.18', '22.22']`). A subida é a issue #743
    #    e acontece quando Node 26 virar LTS, num PR que mexe Dockerfile,
    #    .nvmrc, engines, scripts/check-node.mjs e a matriz juntos.
    #  - `typescript`: a major (7) falha já no `npm ci` pela incompatibilidade
    #    do `@typescript-eslint/*`. A subida é a issue #745 e exige suporte
    #    direto da cadeia ou uma PR explícita com TS6 e TS7 lado a lado.
    #
    # Só a MAJOR é ignorada: minors e patches das duas continuam chegando.
    # O bloco do admin-ui repete estas regras — a política é uma só.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  # O admin-ui é um projeto npm SEPARADO (`src/admin-ui/package.json` +
  # lockfile próprio), e o bloco acima, ancorado em "/", nunca o enxergou. Foi
  # exatamente por isso que um `critical` do Next viveu meses sem PR automática
  # — o mesmo ponto cego que motivou o audit dos DOIS lockfiles no job
  # `dependency-audit` (#521) e o ledger de exceções (#526).
  #
  # O ledger fechou a INVISIBILIDADE: hoje um advisory novo no admin-ui reprova
  # o CI. Mas reprovar sem ninguém abrir a PR de correção transforma o próximo
  # advisory em CI travado à espera de trabalho manual. Este bloco é a outra
  # metade: o ledger avisa, o Dependabot propõe a correção.
  #
  # Cadência, limite de PRs e agrupamentos espelham o bloco da raiz de
  # propósito — a política de atualização do repo é uma só; o que muda é o
  # diretório.
  - package-ecosystem: npm
    directory: "/src/admin-ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      types:
        patterns: ["@types/*"]
      eslint:
        patterns: ["eslint*", "@typescript-eslint/*"]
    # Mesma política de majors do bloco da raiz (issues #743 e #745): a linha
    # de Node e a de TypeScript são decididas por migração, não por bump.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # Node 25 é uma linha ÍMPAR: entrou em EOL sem nunca ter sido LTS. Subir a
      # imagem base para ela troca uma linha suportada por uma que já não recebe
      # correção — o oposto do que um bump de dependência deveria fazer. A PR
      # #538 propunha exatamente isso.
      #
      # O ignore é de `25.x` e SÓ de `25.x`, deliberadamente: bloquear todos os
      # majors ímpares esconderia também o próximo major PAR quando ele chegar
      # numerado logo depois, e o objetivo aqui é pular uma linha morta, não
      # parar de acompanhar o Node.
      - dependency-name: node
        versions: ["25.x"]
