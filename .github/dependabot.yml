version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      types:
        patterns: ["@types/*"]
      eslint:
        patterns: ["eslint*", "@typescript-eslint/*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # Node 25 é uma linha ÍMPAR: entrou em EOL sem nunca ter sido LTS. Subir a
      # imagem base para ela troca uma linha suportada por uma que já não recebe
      # correção — o oposto do que um bump de dependência deveria fazer. A PR
      # #538 propunha exatamente isso.
      #
      # O ignore é de `25.x` e SÓ de `25.x`, deliberadamente: bloquear todos os
      # majors ímpares esconderia também o próximo major PAR quando ele chegar
      # numerado logo depois, e o objetivo aqui é pular uma linha morta, não
      # parar de acompanhar o Node.
      - dependency-name: node
        versions: ["25.x"]
