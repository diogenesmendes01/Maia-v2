# =======================================================================
# docker-compose.yml — DEV compose. NÃO use em produção.
#
# Produção: `compose.prod.yml` (sem portas de datastore no host, Redis com
# auth, containers non-root, env por serviço). Ver README §"Setup produção"
# e docs/runbooks/deploy-prod.md.
#
# Este arquivo existe para o fluxo local (`docker compose up -d postgres
# redis`, usado também por `npm run test:integration:setup`). Postgres e
# Redis ficam publicados APENAS em 127.0.0.1 — nunca em 0.0.0.0 — para que
# uma máquina de dev em rede aberta não exponha datastore com credencial
# fraca (auditoria P0 cap. 6).
# =======================================================================
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: maia-postgres
    restart: unless-stopped
    environment:
      # ⚠️  DEV-ONLY FALLBACK CREDENTIALS (maia/maia). Aceitável somente
      # porque a porta abaixo está amarrada a 127.0.0.1. NUNCA leve este
      # arquivo para um host de produção — compose.prod.yml exige
      # POSTGRES_PASSWORD real (sintaxe `:?`) e não tem fallback.
      POSTGRES_USER: ${POSTGRES_USER:-maia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maia}
      POSTGRES_DB: ${POSTGRES_DB:-maia}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      # Loopback only: alcançável da própria máquina de dev, invisível na LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - maia_pg_data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: maia-redis
    restart: unless-stopped
    # ⚠️  DEV-ONLY: este Redis roda SEM autenticação. Aceitável somente
    # porque a porta está amarrada a 127.0.0.1 (abaixo). Em produção use
    # compose.prod.yml, que exige REDIS_PASSWORD via --requirepass.
    #
    # IMPORTANT: --maxmemory-policy MUST stay `noeviction` (or `volatile-lru`)
    # in any environment with more than one tenant. Redis key isolation in
    # this codebase relies on tenant-prefixed keys (working memory, BullMQ
    # jobs, idempotency ledger, etc. — see PR #241 and friends), but key-
    # prefixing alone does NOT protect a tenant from being evicted to make
    # room for another tenant under `allkeys-*` policies. `noeviction` makes
    # writes fail under memory pressure instead of cross-tenant eviction;
    # `volatile-lru` only evicts keys that carry an explicit TTL. Never use
    # `allkeys-lru` / `allkeys-lfu` / `allkeys-random` here.
    #
    # Caveat: `noeviction` makes pressure surface as a WRITE FAILURE, not an
    # alert — the automated memory-pressure collector + Prometheus alerts are
    # a companion layer (issue #297 / PR #300), and homogeneous app-level OOM
    # handling is tracked in #309. Until those land, monitoring is manual
    # (`redis-cli INFO memory`). See `docs/runbooks/redis.md` §4 for the live
    # vs. pending breakdown, sizing guidance, and the alert thresholds.
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "2gb"
      - "--maxmemory-policy"
      - "noeviction"
    ports:
      # Loopback only — ver comentário do postgres.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - maia_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Job one-shot de migrations (issue #516). Roda UMA vez por release, com a
  # MESMA imagem da aplicação — mesmo artefato de `migrations/`, mesmo runner,
  # mesmos checksums. `app` e `admin-ui` só sobem depois que ele SAI COM
  # SUCESSO (`service_completed_successfully`), então nenhuma réplica jamais
  # inicia sobre banco vazio ou desatualizado, e nenhuma réplica disputa a
  # aplicação das migrations (o advisory lock global garante um migrator só).
  #
  # `restart: "no"` é obrigatório: um job one-shot que reinicia sozinho vira um
  # loop de retry silencioso sobre um schema que já falhou uma vez.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maia-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    # DEV-ONLY: injeta o .env inteiro (mesma ressalva dos demais serviços). Em
    # produção o migrator recebe SÓ o que o manifesto do serviço declara —
    # ver compose.prod.yml.
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-maia}:${POSTGRES_PASSWORD:-maia}@postgres:5432/${POSTGRES_DB:-maia}
      TZ: America/Sao_Paulo
    command: ["node", "dist/cli/maia.js", "migrate", "up"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maia-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # DEV-ONLY: injeta o .env inteiro. Em produção cada container recebe
    # apenas o SEU env file (.env.app / .env.admin) — ver compose.prod.yml.
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-maia}:${POSTGRES_PASSWORD:-maia}@postgres:5432/${POSTGRES_DB:-maia}
      REDIS_URL: redis://redis:6379
      TZ: America/Sao_Paulo
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - maia_baileys_auth:/app/.baileys-auth
      - maia_media:/app/media

  # admin-ui (Next.js) — separate container so Coolify routes
  # `admin.${DOMAIN}` to :4000 while `${DOMAIN}` keeps pointing at the
  # Fastify `app` service on :3000. Build context is the REPO ROOT because
  # admin-ui imports `@/db/schema.ts`, `@/lib/*`, etc.
  admin-ui:
    build:
      context: .
      dockerfile: src/admin-ui/Dockerfile
    container_name: maia-admin-ui
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # DEV-ONLY: .env inteiro — mesma ressalva do serviço `app` acima.
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-maia}:${POSTGRES_PASSWORD:-maia}@postgres:5432/${POSTGRES_DB:-maia}
      # NEXTAUTH_URL and NEXTAUTH_SECRET come from .env — they MUST be set
      # for the admin-ui to boot in production (see `resolveSecret()` in
      # src/admin-ui/lib/auth-gating.ts: refuses to boot with a <32-char
      # secret in prod).
      #
      # AUTH_TRUST_HOST=true: required when running behind a reverse proxy
      # (Coolify, nginx, ALB) that terminates TLS upstream. Without it,
      # NextAuth v5 rejects any request whose Host header doesn't match
      # NEXTAUTH_URL exactly — which is the normal case for proxied
      # traffic (proxy passes localhost or internal hostname to the
      # container). The proxy is now the trusted edge for host validation.
      AUTH_TRUST_HOST: 'true'
      TZ: America/Sao_Paulo
    ports:
      - "${ADMIN_UI_PORT:-4000}:4000"

volumes:
  maia_pg_data:
  maia_redis_data:
  maia_baileys_auth:
  maia_media:
