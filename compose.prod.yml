# =======================================================================
# compose.prod.yml — compose de PRODUÇÃO (auditoria P0 cap. 6).
#
# Uso:
#   docker compose --env-file .env.infra -f compose.prod.yml up -d
#
# As variáveis de interpolação (POSTGRES_USER/PASSWORD/DB, REDIS_PASSWORD,
# MAIA_ENV) são OBRIGATÓRIAS (sintaxe `:?` — o compose aborta se faltarem,
# nada de fallback maia/maia e nada de perfil de produção assumido em
# silêncio). Elas vêm do shell do deploy ou de um env-file
# passado via `--env-file` (ex.: .env.infra). Esse arquivo serve SÓ para
# interpolação — ele NÃO é injetado em nenhum container. Cada serviço
# recebe apenas o seu próprio env_file:
#   app      → .env.app    (ver .env.app.prod.example)
#   admin-ui → .env.admin  (ver .env.admin.prod.example)
#   migrate  → NENHUM env_file: só o subset `migrator` do contrato (#515),
#              injetado direto no `environment:` do serviço.
#
# Ordem de subida (issue #516): postgres healthy → `migrate` (job one-shot)
# sair com 0 → app + admin-ui. Nenhum serviço de aplicação sobe contra um
# schema atrasado, e um blocker de migration (dirty/checksum/missing_file)
# segura o deploy inteiro em vez de deixar o app subir e responder 503.
#
# Postura de segurança vs docker-compose.yml (dev):
#   - postgres/redis NÃO publicam porta no host: vivem na rede `data`
#     (internal: true), alcançáveis apenas por app/admin-ui.
#   - app/admin-ui também NÃO publicam porta: o reverse proxy
#     (nginx/Traefik/Coolify) conecta-se à rede `web` deste projeto e
#     roteia para app:3000 / admin-ui:4000.
#   - Redis exige autenticação (--requirepass) e o healthcheck autentica
#     via REDISCLI_AUTH (senha fora do argv do healthcheck).
#   - Todos os serviços rodam non-root, rootfs read-only (tmpfs onde
#     preciso), cap_drop ALL, no-new-privileges e pids_limit.
#
# Wiring do reverse proxy (fora deste arquivo): no compose do proxy,
# declare a rede como externa e conecte o serviço a ela, ex.:
#   networks:
#     maia_web:
#       external: true
#       name: maia-v2_web   # <project>_web — confira com `docker network ls`
#
# Verificação pós-deploy, migração de volumes root-era e rollback:
# docs/runbooks/deploy-prod.md.
# =======================================================================
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: maia-postgres
    restart: unless-stopped
    # Non-root desde o boot: o entrypoint nunca roda como root. Volumes
    # criados por deployments antigos já pertencem ao uid 999 (o entrypoint
    # root-era fazia chown para `postgres` antes de dropar privilégio).
    user: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in prod (no fallback)}
      # Sem fallback: faltou senha ⇒ o compose aborta em vez de subir maia/maia.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in prod (no fallback; min 8 chars, URL-safe)}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in prod (no fallback)}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    # SEM `ports:` — 5432 nunca chega ao host em produção.
    networks:
      - data
    volumes:
      - maia_pg_data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    read_only: true
    tmpfs:
      # Socket unix + scratch. tmpfs monta com mode 1777 (gravável pelo
      # uid 999 mesmo com rootfs read-only).
      - /tmp
      - /var/run/postgresql
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    healthcheck:
      # `$$` escapa a interpolação do compose: o shell DO CONTAINER expande
      # POSTGRES_USER/DB em runtime. pg_isready usa o socket local e não
      # recebe/loga senha alguma.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: maia-redis
    restart: unless-stopped
    # uid 999 na imagem alpine; volumes root-era já pertencem a `redis`
    # (o entrypoint antigo fazia chown antes do su-exec).
    user: redis
    # IMPORTANT: --maxmemory-policy MUST stay `noeviction` (or `volatile-lru`)
    # in any environment with more than one tenant: key-prefixing alone does
    # NOT protect a tenant from being evicted to make room for another tenant
    # under `allkeys-*` policies. Full rationale in docker-compose.yml (dev)
    # and `docs/runbooks/redis.md` §4 — pressure surfaces as WRITE FAILURE,
    # monitoring via `redis-cli INFO memory` until #297/#309 land.
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "2gb"
      - "--maxmemory-policy"
      - "noeviction"
      # AUTH obrigatória — Redis sem senha não sobe em produção.
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required in prod (unauthenticated Redis is not allowed)}"
    environment:
      # redis-cli lê REDISCLI_AUTH do ambiente — o healthcheck autentica sem
      # colocar a senha no argv (que vazaria em `docker inspect`/ps).
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required in prod}
    # SEM `ports:` — 6379 nunca chega ao host em produção.
    networks:
      - data
    volumes:
      - maia_redis_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      # PING AUTENTICADO (via REDISCLI_AUTH acima). Um PING sem auth
      # responderia NOAUTH e o grep falharia — ou seja, o healthcheck também
      # falha se alguém remover o --requirepass por engano.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # migrate — JOB ONE-SHOT (issue #516). Aplica as migrations e SAI.
  #
  #   postgres healthy → migrate completed successfully → app + admin-ui
  #
  # Antes disto o deploy documentado subia os serviços e o operador rodava
  # `exec app npm run db:migrate` DEPOIS, à mão: entre um passo e outro a
  # aplicação já estava de pé contra um schema atrasado. Com o job, a
  # ordem é uma propriedade do arquivo, não da memória de quem deployou.
  #
  # Contrato do job (é dele que `service_completed_successfully` depende):
  # `tsx scripts/migrate.ts up` roda UMA vez e sai 0 em sucesso/já-atualizado,
  # != 0 em falha, blocker (dirty, checksum mismatch, missing_file) ou lock
  # indisponível. Um blocker portanto SEGURA app/admin-ui fora do ar — que é
  # o comportamento fail-closed pedido pela issue.
  #
  # `restart: "no"` é OBRIGATÓRIO e explícito: com `unless-stopped` (o que
  # todos os outros serviços usam aqui) o container reiniciaria ao sair e
  # NUNCA chegaria a "completed" — app/admin-ui esperariam para sempre.
  #
  # Réplicas: o job continua seguro se dois deploys rodarem ao mesmo tempo —
  # o advisory lock global do runner (src/migrations/lock.ts) serializa, e o
  # segundo migrator sai de forma limpa e observável.
  #
  # Este bloco é VERIFICADO DE DUAS FORMAS, e as duas são necessárias:
  #   - `tests/unit/migrations/compose-migrate-job.spec.ts` lê este arquivo e
  #     pina o que ele DIZ (restart, depends_on, uid, read_only, subset #515);
  #   - `scripts/smoke-migrate-image.sh` (`npm run smoke:migrate:image`, job
  #     `smoke-migrate-image` no CI) constrói a imagem real e RODA
  #     `npm run db:migrate` dentro dela, uid 1001, rootfs read-only, contra
  #     banco efêmero. Sem ele, `tmpfs: /tmp` abaixo pareceria higiene: é
  #     requisito — o `tsx` cria `/tmp/tsx-1001` antes do primeiro módulo.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maia-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    user: "1001:1001"
    # SEM env_file: o migrator recebe SÓ o subset `migrator` do contrato
    # (#515 — src/config/migration-config.ts, src/config/generated/
    # service-env-manifest.json): Postgres + knobs de processo. Nada de
    # .env.app (LLM keys, sessão WhatsApp, credenciais S3): um container de
    # migration que vaze não pode vazar o que nunca recebeu.
    environment:
      NODE_ENV: production
      # Obrigatória no profile production (contract.ts: `requiredIn`), e
      # OBRIGATÓRIA TAMBÉM NA INTERPOLAÇÃO — `:?`, não `:-production`.
      #
      # O default parecia inofensivo: "produção é o caso comum, staging
      # sobrescreve". Só que ele inverte o fail-closed exatamente no ponto em
      # que o erro é invisível. Um staging que esquece MAIA_ENV no .env.infra
      # não recebe um erro: recebe SILENCIOSAMENTE o perfil de produção, e a
      # primeira notícia disso é uma regra de produção sendo aplicada — ou
      # relaxada — num ambiente que ninguém achava que era produção. Com `:?`
      # o compose aborta antes de criar container algum, e a mensagem diz o
      # nome da variável que falta.
      #
      # `.env.infra` passa a declarar `MAIA_ENV=production` (ou `staging`)
      # explicitamente — ver docs/runbooks/deploy-prod.md §1.
      #
      # A MESMA linha, byte por byte, está em `app` e em `admin-ui`. O
      # contrato marca MAIA_ENV como `services: ALL` e
      # `requiredIn: ['staging','production']`, e `.env.infra` serve SÓ para
      # interpolação — declarar a variável lá NÃO a injeta em container
      # nenhum. Sem estas três linhas o migrator terminava com sucesso e
      # `app`/`admin-ui` reprovavam no boot por configuração ausente, seguindo
      # o runbook à risca. Repetida em vez de ancorada (`&`/`*`) de propósito:
      # o guard que lê este arquivo exige as três idênticas, e uma âncora
      # esconderia a divergência dentro do YAML em vez de expô-la.
      MAIA_ENV: ${MAIA_ENV:?MAIA_ENV is required (production|staging) — declare-a no .env.infra; sem ela um staging assumiria o perfil de produção em silêncio}
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      # rootfs read-only: sem isto o npm tentaria escrever o cache em
      # $HOME (/home/maia), que não é gravável aqui.
      npm_config_cache: /tmp/.npm
      TZ: America/Sao_Paulo
    command: ["npm", "run", "db:migrate"]
    # SEM `ports:`, SEM rede `web` — o job só fala com o Postgres.
    networks:
      - data
    # As migrations vêm empacotadas na imagem (Dockerfile: COPY migrations),
    # que é o que torna checksum/`missing_file` uma afirmação sobre ESTA
    # build. Nenhum volume de estado.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maia-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # O schema tem que estar no head ANTES do primeiro request (#516).
      migrate:
        condition: service_completed_successfully
    # uid/gid 1001 (`maia`) já é o USER do runtime stage do Dockerfile;
    # repetir aqui garante que um drift na imagem não traga root de volta.
    user: "1001:1001"
    # Apenas os segredos DO APP — nada de .env global (o admin-ui tem o seu).
    env_file:
      - .env.app
    environment:
      NODE_ENV: production
      # MESMA fonte única do job `migrate` (ver o comentário lá em cima).
      # `NODE_ENV=production` sozinho NÃO basta: o contrato exige MAIA_ENV nos
      # profiles staging/production (`requiredIn`), e `.env.app` não a declara —
      # o `.env.app.prod.example` manda explicitamente NÃO defini-la ali, para
      # que não existam duas fontes que possam divergir do migrator.
      MAIA_ENV: ${MAIA_ENV:?MAIA_ENV is required (production|staging) — declare-a no .env.infra; sem ela um staging assumiria o perfil de produção em silêncio}
      # DATABASE_URL/REDIS_URL compostas das MESMAS vars obrigatórias com que
      # os datastores sobem — sem fallback e sem drift entre serviço e URL.
      # NOTA: a senha entra numa URL — use senha URL-safe (ex.:
      # `openssl rand -hex 24`) ou percent-encode caracteres reservados.
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      # src/config/env.ts também exige as vars discretas (backup/scripts):
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      TZ: America/Sao_Paulo
    # SEM `ports:` — o proxy alcança app:3000 pela rede `web`.
    networks:
      - data
      - web
    volumes:
      # Estado persistente: sessão Baileys + mídia. Devem ser graváveis pelo
      # uid 1001 — volumes novos herdam o chown feito no Dockerfile; volumes
      # de um deployment root-era precisam de chown único (ver runbook).
      - maia_baileys_auth:/app/.baileys-auth
      - maia_media:/app/media
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    # Issue #512 — a janela de drain tem que caber ANTES do SIGKILL do Docker
    # (default 10s). SHUTDOWN_GRACE_MS (default 25s) + fechamento de recursos
    # cabe em 40s; se aumentar o grace no .env, aumente isto junto.
    stop_grace_period: 40s
    healthcheck:
      # Issue #512 — LIVENESS usa `/livez`: sem I/O, sem DB/Redis/WhatsApp. O
      # healthcheck antigo batia em `/health`, que agrega dependências: uma
      # queda de Postgres marcava o CONTAINER unhealthy e o restart matava o
      # processo em vez de deixar o `/readyz` tirar a instância de rotação.
      # Node 22 tem fetch global — sem curl/wget, sem segredo no comando.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/livez').then(function(r){process.exit(r.ok?0:1)}).catch(function(){process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Startup: `/startupz` só vira 200 quando o lifecycle chega em `ready`.
      start_period: 30s

  # admin-ui (Next.js) — container separado; o proxy roteia
  # `admin.${DOMAIN}` → admin-ui:4000 pela rede `web`.
  admin-ui:
    build:
      context: .
      dockerfile: src/admin-ui/Dockerfile
    container_name: maia-admin-ui
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Mesma razão do `app`: o console lê tabelas que só existem depois
      # das migrations (#516).
      migrate:
        condition: service_completed_successfully
    user: "1001:1001"
    # Apenas os segredos DO ADMIN (NextAuth/OIDC + o HMAC de verificação de
    # trace) — o .env do app NÃO entra aqui. Desde a issue #596 não há mais
    # "mínimo transitivo que src/config/env.ts exige": o console não importa
    # aquele singleton, valida o subset `admin-ui` no boot
    # (src/admin-ui/instrumentation.ts) e não recebe mais as seis BACKUP_*.
    env_file:
      - .env.admin
    environment:
      NODE_ENV: production
      # MESMA fonte única do job `migrate` e do `app` (ver os comentários
      # acima). `.env.admin` não declara MAIA_ENV pelo mesmo motivo: uma
      # segunda fonte é uma fonte que pode divergir.
      MAIA_ENV: ${MAIA_ENV:?MAIA_ENV is required (production|staging) — declare-a no .env.infra; sem ela um staging assumiria o perfil de produção em silêncio}
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      # O console publica invalidação de cache (best-effort, engolida em caso
      # de falha) por `@/lib/llm/cache-invalidation.js` e
      # `@/agent/turn-context/cache.js`, ambos por import DINÂMICO — sem
      # REDIS_URL essas publicações se perdem e o cache degrada para o TTL.
      # Desde a issue #596 ela não é mais exigida no BOOT do console (o subset
      # `admin-ui` não a declara); continua injetada porque o caminho existe.
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      # NEXTAUTH_URL/NEXTAUTH_SECRET vêm de .env.admin — `resolveSecret()`
      # (src/admin-ui/lib/auth-gating.ts) recusa boot com secret <32 chars
      # ou placeholder conhecido.
      #
      # AUTH_TRUST_HOST=true: atrás de reverse proxy que termina TLS, o
      # proxy é a borda confiável para validação de Host (NextAuth v5).
      AUTH_TRUST_HOST: 'true'
      TZ: America/Sao_Paulo
    # SEM `ports:` — o proxy alcança admin-ui:4000 pela rede `web`.
    networks:
      - data
      - web
    read_only: true
    tmpfs:
      - /tmp
      # Next.js escreve cache de runtime (ISR/imagens/fetch-cache) aqui.
      - /app/src/admin-ui/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    healthcheck:
      # Qualquer resposta <500 = servidor de pé (a raiz pode redirecionar
      # para o sign-in). Sem credencial no comando.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/').then(function(r){process.exit(r.status<500?0:1)}).catch(function(){process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  # Rede interna dos datastores: SEM rota para fora do host (internal) —
  # postgres/redis só falam com app/admin-ui.
  data:
    internal: true
  # Rede de entrada: o reverse proxy conecta-se a ela para alcançar
  # app:3000 / admin-ui:4000. Nenhum serviço publica porta no host.
  web:

volumes:
  # Mesmos nomes do compose de dev de propósito: um host que migra do
  # docker-compose.yml antigo para este arquivo (mesmo diretório ⇒ mesmo
  # project name) REUSA os dados existentes. `up -d` nunca apaga volumes;
  # evite `down -v` em produção.
  maia_pg_data:
  maia_redis_data:
  maia_baileys_auth:
  maia_media:
