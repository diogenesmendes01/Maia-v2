# gitleaks configuration
#
# Keep ALL of gitleaks' built-in rules active. We only ADD a narrow allowlist
# below; we never disable a default rule, so real secrets are still detected.
[extend]
useDefault = true

# ----------------------------------------------------------------------------
# Squash-stable false-positive suppression (PR #326 / #316)
# ----------------------------------------------------------------------------
# The unit test tests/unit/tools/idempotency-outbox-dispatcher.spec.ts asserts,
# via toMatchObject, the call args recorded for a MOCK recorder. One asserted
# field is a deterministic, low-entropy fake fixture value ("computed-key-1")
# produced by the test's stubbed key computation. It is NOT a credential, but
# the generic-api-key rule trips on the assignment shape.
#
# Why a config allowlist instead of a .gitleaksignore fingerprint:
#   The previous suppression lived in .gitleaksignore keyed by commit
#   fingerprint. PR #326 was SQUASH-merged, which rewrote the commit SHA, so
#   the fingerprint stopped matching and gitleaks re-detected the same fixture.
#   Commit-fingerprint suppressions are not squash-stable. This allowlist is
#   keyed by PATH + the exact fixture VALUE, so it survives squashes, rebases,
#   and line-number shifts.
#
# Scope is intentionally minimal (condition = "AND"): it matches ONLY when the
# finding is in that one spec file AND the extracted secret is exactly the fake
# fixture value. Any other secret — in this file or anywhere else — is still
# reported.
[[allowlists]]
description = "Fake unit-test fixture value in idempotency outbox dispatcher spec (PR #326 / #316) — not a real credential"
condition = "AND"
# Matches against the file path of the finding.
paths = ['''tests/unit/tools/idempotency-outbox-dispatcher\.spec\.ts''']
# regexTarget defaults to "secret": this matches the extracted secret group,
# not the whole line, so it cannot accidentally allowlist a neighbouring value.
# The bare fixture token is written here WITHOUT the key-assignment shape on
# purpose, so this config does not itself trip the generic-api-key rule.
regexes = ['''^computed-key-1$''']

# ----------------------------------------------------------------------------
# Generated configuration fixtures (issue #515)
# ----------------------------------------------------------------------------
# `src/config/generated/fixtures/*.env` are GENERATED by `npm run config:generate`
# from `src/config/contract.ts`. They exist to prove the contract is satisfiable
# (CI validates each one against its profile in strict mode), so every value is
# a synthetic literal — deliberately `fixture-*`-prefixed, or an all-zero base64
# block for the key-shaped fields. None of them authenticates against anything.
#
# Scope is minimal (condition = "AND"): the finding must be in one of those
# generated files AND the extracted secret must match one of the synthetic
# shapes below. A real credential accidentally committed into the same file is
# still reported, and every other path is untouched.
#
# `tests/unit/config/generated-artifacts.spec.ts` independently asserts that no
# generated artifact contains anything shaped like a REAL provider credential.
[[allowlists]]
description = "Synthetic values in the generated config fixtures (#515) — not credentials"
condition = "AND"
paths = ['''src/config/generated/fixtures/.*\.env$''']
regexes = [
  '''^(sk-ant-|sk-or-|sk-)?fixture[-0-9a-z]*$''',
  '''^fixture[-0-9a-z]*$''',
  # Unanchored: the DSN fixtures embed the synthetic password mid-string
  # (`postgres://maia:fixture0000pass@…`, `redis://:fixture0000pass@…`).
  '''fixture[-0-9a-z]*''',
  '''^A{20,}=$''',
  '''^\{"k1":"A{20,}="\}$''',
]

# The generated `.env.example` ships PLACEHOLDERS on purpose: the strict
# staging/production validation rejects any value matching `__SET_ME__`,
# `changeme`, `trocar_` or a trailing `...`. They are documentation, not
# credentials, and `npm run config:check -- --profile production` fails on them.
[[allowlists]]
description = "Documented placeholders in the generated .env.example (#515) — rejected by strict validation"
condition = "AND"
paths = ['''^\.env\.example$''']
regexes = [
  '''^__SET_ME__''',
  '''^trocar_''',
  '''\.\.\.$''',
]

# ----------------------------------------------------------------------------
# Synthetic request_key in the maia.hermes.worker.v1 contract fixtures (PR #766)
# ----------------------------------------------------------------------------
# One hand-written UUID is the idempotency key of the run in the Hermes wire
# contract fixtures and tests. It is not a credential; generic-api-key trips on
# the key-shaped field name plus the token shape and entropy (3.898 > 3.5).
#
# Why [[rules]] + [[rules.allowlists]] and NOT a top-level [[allowlists]]:
#   gitleaks-action@v3 installs gitleaks 8.24.3. Its ViperConfig reads only a
#   singular top-level [allowlist] (no `condition`); the top-level
#   [[allowlists]] array exists only from 8.25.0 and is silently ignored before
#   that. Rule-level allowlists ARE merged into the default rule of the same id
#   when extending the default config, and rule validation runs after the merge.
#
# Scope is minimal (condition = "AND"): the finding must be in one of the listed
# test files AND the extracted secret must be exactly the synthetic UUID. The
# same value anywhere else, or any other token in these files, is still reported.
# tests/unit/ci/gitleaks-fixture-allowlist.spec.ts pins this shape and scope.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Synthetic request_key UUID in the maia.hermes.worker.v1 contract fixtures (PR #766) - not a credential"
condition = "AND"
paths = ['''(?:^|/)(?:tests/fixtures/hermes-wire/frames\.json|tests/unit/(?:hermes-wire-contract|agent-engine-contract|maia-engine)\.spec\.ts|services/hermes_worker/tests/test_(?:protocol_fixtures|ipc|bootstrap)\.py)$''']
regexes = ['''^8a1e2c3d-4b5a-4c7d-8e9f-0a1b2c3d4e5f$''']
